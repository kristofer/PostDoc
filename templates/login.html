<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZCW PostDoc – Admin Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      color: #333;
    }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2.5rem; color: #1a73e8; }
    header p  { color: #666; margin-top: 0.4rem; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .card h2 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #333; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
      transition: border-color .2s;
    }
    input[type=text]:focus, input[type=password]:focus {
      outline: none;
      border-color: #1a73e8;
    }
    button[type=submit] {
      width: 100%;
      padding: 0.8rem;
      background: #1a73e8;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    button[type=submit]:hover { background: #1558b0; }
    .error {
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>ZCW PostDoc</h1>
    <p>Admin access required.</p>
  </header>

  <div class="card">
    <h2>Sign in</h2>
    {{if .Error}}
    <div class="error">{{.Error}}</div>
    {{end}}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
