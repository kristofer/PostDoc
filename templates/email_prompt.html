<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostDoc – Download</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      color: #333;
    }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2.5rem; color: #1a73e8; }
    header p  { color: #666; margin-top: 0.4rem; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }
    .card h2 { font-size: 1.1rem; color: #333; margin-bottom: 0.4rem; }
    .card .filename { color: #555; font-size: 0.95rem; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input[type=email] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type=email]:focus { border-color: #1a73e8; }
    button[type=submit] {
      width: 100%;
      margin-top: 1rem;
      padding: 0.8rem;
      background: #1a73e8;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    button[type=submit]:hover { background: #1558b0; }
    .error {
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .note { font-size: 0.8rem; color: #999; margin-top: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>PostDoc</h1>
    <p>Enter your email address to download this document.</p>
  </header>

  <div class="card">
    <h2>Download</h2>
    <p class="filename">{{.Filename}}</p>

    {{if .Error}}
    <div class="error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/{{.Slug}}">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required
             placeholder="you@example.com" autocomplete="email">
      <button type="submit">Download Document</button>
      <p class="note">Your email will be recorded for tracking purposes.</p>
    </form>
  </div>
</body>
</html>
