<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostDoc – Link Created</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      color: #333;
    }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2.5rem; color: #1a73e8; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    .checkmark { font-size: 3rem; }
    .card h2 { margin: 0.8rem 0 0.4rem; color: #2d7d2d; }
    .card .filename { color: #555; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .url-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #f0f4ff;
      border: 1px solid #c5d5ff;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1rem;
    }
    .url-box a {
      flex: 1;
      color: #1a73e8;
      font-weight: 600;
      word-break: break-all;
      text-decoration: none;
    }
    .url-box a:hover { text-decoration: underline; }
    .copy-btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: background .2s;
    }
    .copy-btn:hover { background: #1558b0; }
    .back-link {
      display: inline-block;
      margin-top: 1.2rem;
      color: #1a73e8;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>PostDoc</h1>
  </header>

  <div class="card">
    <div class="checkmark">✅</div>
    <h2>Document uploaded!</h2>
    <p class="filename">{{ .Filename }}</p>

    <p style="margin-bottom:0.6rem;font-weight:600;">Your shareable link:</p>
    <div class="url-box">
      <a id="short-url" href="{{ .ShortURL }}" target="_blank">{{ .ShortURL }}</a>
      <button class="copy-btn" onclick="copyURL()">Copy</button>
    </div>

    <a class="back-link" href="/">← Upload another document</a>
  </div>

  <script>
    function copyURL() {
      navigator.clipboard.writeText(document.getElementById('short-url').href)
        .then(() => alert('Link copied to clipboard!'))
        .catch(() => alert('Copy failed – please copy manually.'));
    }
  </script>
</body>
</html>
